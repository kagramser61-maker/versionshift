name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: for f in *.zip; do unzip -q "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Build
        working-directory: VersionShift
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: versionshift-jar
          path: VersionShift/build/libs/*.jar
